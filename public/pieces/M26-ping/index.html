<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>M26 Ping</title>
<link rel="stylesheet" href="../pieces.css" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;590;600&family=Noto+Color+Emoji&display=block" />
<style>
  /* A GearBook notification drops in over footage on a ding (ding.wav, laid in by the edit), holds
     long enough to read, then slides away. Three looks: Banner (a phone notification), House
     (cream and topo card, Roca title), Island (a black pill that opens into the message).
     Kept between y 230 and 1520. Banner spans the width like a real phone notification: it sits
     at the top, clear of Instagram's button rail lower down, so the rail check is off for it.
     Banner is sized from a phone's own notification (Inter for the system font): glass fill over
     a blur of the footage, which the edit adds from the shape this page draws with ?props={"mask":true}. */
  .card { position: absolute; left: 54px; top: 250px; width: 846px; }
  .icon { flex: none; width: 92px; height: 92px; border-radius: 22px; background: url("../../brand/gearbook-profile-picture.svg") center / cover; }
  .app { display: flex; justify-content: space-between; font-size: 27px; letter-spacing: 0.06em; text-transform: uppercase; }
  .t { font-weight: 600; }

  body[data-look="banner"] .card { left: 40px; width: 1000px; display: flex; gap: 28px; align-items: center; padding: 36px 40px 38px 36px; border-radius: 60px;
    background: rgba(247, 247, 245, 0.66); color: #000; box-shadow: 0 6px 30px rgba(0, 0, 0, 0.16), inset 0 0 0 1px rgba(255, 255, 255, 0.35);
    font-family: Inter, -apple-system, system-ui, sans-serif, "Noto Color Emoji"; -webkit-font-smoothing: antialiased; }
  body[data-look="banner"] .icon { width: 100px; height: 100px; border-radius: 23px; box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.06); }
  body[data-look="banner"] .text { flex: 1; min-width: 0; }
  body[data-look="banner"] .row { display: flex; justify-content: space-between; align-items: baseline; gap: 20px; }
  body[data-look="banner"] .t { font-size: 40px; font-weight: 600; letter-spacing: -0.012em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  body[data-look="banner"] .when { flex: none; font-size: 35px; color: rgba(60, 60, 67, 0.62); letter-spacing: -0.01em; }
  body[data-look="banner"] .b { font-size: 40px; line-height: 1.3; letter-spacing: -0.012em; margin-top: 2px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  body[data-look="banner"] .card.mask { background: #fff; box-shadow: none; }
  body[data-look="banner"] .card.mask > * { visibility: hidden; }

  body[data-look="house"] .card { overflow: hidden; padding: 40px 44px 44px 58px; border-radius: 30px; background: var(--cream); color: var(--bark);
    box-shadow: 0 22px 60px rgba(0, 0, 0, 0.32); }
  body[data-look="house"] .card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 14px; background: var(--amber); }
  body[data-look="house"] .card .topo { opacity: 0.55; }
  body[data-look="house"] .app { position: relative; font-family: var(--label); font-weight: 600; font-size: 25px; letter-spacing: 0.3em; color: var(--ink-muted); }
  body[data-look="house"] .app .dot { display: inline-block; width: 14px; height: 14px; border-radius: 50%; background: var(--amber); margin-right: 14px; vertical-align: 2px; }
  body[data-look="house"] .t { position: relative; font-family: var(--display); font-weight: 700; font-size: 58px; line-height: 1.05; margin-top: 18px; }
  body[data-look="house"] .b { position: relative; font-size: 33px; line-height: 1.3; margin-top: 14px; color: #4a4330; }

  body[data-look="island"] .card { left: 477px; width: 846px; height: 214px; margin-left: -423px; border-radius: 60px; background: #0d0c09; color: var(--cream);
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.35); overflow: hidden; }
  body[data-look="island"] .inner { position: absolute; left: 34px; top: 30px; right: 40px; display: flex; gap: 26px; align-items: center; }
  body[data-look="island"] .text { flex: 1; min-width: 0; }
  body[data-look="island"] .app { color: var(--amber); font-family: var(--label); font-weight: 600; font-size: 25px; letter-spacing: 0.24em; }
  body[data-look="island"] .t { font-size: 38px; margin-top: 6px; }
  body[data-look="island"] .b { font-size: 31px; line-height: 1.25; margin-top: 2px; color: #cfc9b6; }
</style>
</head>
<body>
<div id="stage"></div>
<script src="../runtime.js"></script>
<script>
  const { el, tick, progress, outCubic } = Motion;
  const IN = 0.08, OUT = 2.95;

  Motion.init({
    duration: 3.4,
    hold: 0.8,
    looks: ["banner", "house", "island"],
    overlay: true,
    checkAt: [0.9, 1.8, 2.6],
    checkRail: Motion.look !== "banner" && Motion.look !== null,
    // The piece's variables. Override any of them with ?props={...}.
    defaults: {
      app: "GearBook",
      when: "now",
      mask: false,
      title: "New GearBook promo",
      body: "Something new just dropped for members. Tap to take a look 🤙",
    },
    build(stage, p, look) {
      const card = el("div", { class: "card" }, stage);
      const app = el("div", { class: "app" });
      const left = el("span", {}, app);
      if (look === "house") el("span", { class: "dot" }, left);
      left.append(look === "house" ? `${p.app} · ${p.when}` : p.app);
      if (look !== "house") el("span", { text: p.when, style: { textTransform: "none", letterSpacing: "0" } }, app);
      const text = el("div", { class: "text" });
      text.append(app);
      el("div", { class: "t", text: p.title }, text);
      el("div", { class: "b", text: p.body }, text);

      if (look === "banner") {
        // A phone notification: icon, bold title with the time, two lines of body.
        card.textContent = "";
        if (p.mask) card.classList.add("mask");
        el("div", { class: "icon" }, card);
        const tx = el("div", { class: "text" }, card);
        const row = el("div", { class: "row" }, tx);
        el("div", { class: "t", text: p.title }, row);
        el("div", { class: "when", text: p.when }, row);
        el("div", { class: "b", text: p.body }, tx);
        // Slides down from above the frame on a soft spring and settles; leaves the same way.
        const spring = (x) => 1 - Math.exp(-7.5 * x) * Math.cos(9 * x);
        tick((t) => {
          const k = spring(Math.max(0, t - IN)) * (t >= IN ? 1 : 0);
          const out = Math.pow(progress(t, OUT, 0.38), 2);
          const y = -480 * (1 - k) - 520 * out;
          card.style.transform = `translateY(${y}px) scale(${0.97 + 0.03 * Math.min(1, k)})`;
        });
      }

      if (look === "house") {
        el("div", { class: "topo" }, card);
        card.append(app);
        app.style.position = "relative";
        el("div", { class: "t", text: p.title }, card);
        el("div", { class: "b", text: p.body }, card);
        card.animate([{ transform: "translateY(-560px) rotate(-2deg)" }, { transform: "translateY(10px) rotate(0.4deg)", offset: 0.7 }, { transform: "none" }],
          { duration: 640, delay: IN * 1000, easing: Motion.ease.arrive, fill: "both" });
        card.animate([{ transform: "none" }, { transform: "translateY(-560px)" }], { duration: 420, delay: OUT * 1000, easing: "cubic-bezier(.5,0,.8,.3)", fill: "forwards", composite: "add" });
      }

      if (look === "island") {
        const inner = el("div", { class: "inner" }, card);
        el("div", { class: "icon" }, inner);
        inner.append(text);
        // A pill at the top opens out into the message, then closes and leaves.
        tick((t) => {
          const open = outCubic(progress(t, IN + 0.18, 0.5)), close = progress(t, OUT - 0.15, 0.35);
          const k = open * (1 - outCubic(close));
          card.style.width = `${240 + (846 - 240) * k}px`;
          card.style.marginLeft = `${-(240 + (846 - 240) * k) / 2}px`;
          card.style.height = `${70 + (214 - 70) * k}px`;
          card.style.borderRadius = `${35 + 25 * k}px`;
          const appear = outCubic(progress(t, IN, 0.2)) * (1 - progress(t, OUT + 0.2, 0.2));
          card.style.opacity = appear;
          card.style.transform = `scale(${0.8 + 0.2 * appear})`;
          inner.style.opacity = progress(t, IN + 0.45, 0.25) * (1 - progress(t, OUT - 0.2, 0.15));
        });
      }
    },
  });
</script>
</body>
</html>
