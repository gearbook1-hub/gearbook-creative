<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>R06 Season Loading</title>
<link rel="stylesheet" href="../pieces.css" />
<style>
  /* R06: the feed's "Winter [loading]" vibe reel (2026-10-02), animated and built as a series.
     A big season word over a loading bar; the kit drops in fast on white tiles and the bar fills
     with each, while a loader status line under the bar swaps to match each product. It stalls
     at 99% on its own line, then hits 100% and turns sage. End card on bark.
     v2 (Luke, 2026-10-19): 8 products, faster drops, status copy that changes as it loads
     instead of one static joke line. Season, sport, products (each with its own status line),
     stall line, done line and end line are all props, so spring climbing or summer dive is a
     new URL, not new code. A product without a photo gets a text-only tile. */
  .eyebrow.sport { position: absolute; left: 90px; top: 232px; font-size: 34px; color: var(--ink-muted); }
  .season { position: absolute; left: 84px; top: 288px; white-space: nowrap;
    font-family: var(--display); font-weight: 700; font-size: 212px; line-height: 1; letter-spacing: -0.02em; }
  .season span { display: inline-block; }

  .load { position: absolute; left: 90px; top: 512px; width: 810px; }
  .load .row { display: flex; align-items: baseline; justify-content: space-between; }
  .load .tag { font-family: var(--label); font-weight: 600; font-size: 40px; letter-spacing: 0.12em; }
  .load .pct { font-family: var(--display); font-weight: 700; font-size: 72px; line-height: 1; font-variant-numeric: tabular-nums; }
  .track { margin-top: 16px; height: 46px; border-radius: 24px; border: 4px solid var(--bark); padding: 5px; }
  .fill { height: 100%; border-radius: 16px; background: var(--amber); transform-origin: left; transform: scaleX(0); }
  .done .fill { background: var(--sage); }

  /* The loader's status line: left-aligned so the cycling dots never shift the words. */
  .status { position: absolute; left: 92px; top: 668px; width: 806px; height: 60px; overflow: hidden;
    font-family: var(--body); font-weight: 500; font-size: 46px; line-height: 60px; white-space: nowrap; color: var(--bark); }
  .status span { display: inline-block; }

  .tiles { position: absolute; left: 90px; top: 762px; width: 810px; }
  .tile { position: absolute; width: 250px; height: 236px; border-radius: 24px; background: var(--white);
    box-shadow: 0 16px 36px rgba(61, 53, 34, 0.16); display: flex; flex-direction: column; align-items: center; padding: 14px 14px 10px; }
  .tile img { width: 100%; height: 150px; object-fit: contain; display: block; }
  .tile .name { margin-top: 8px; font-family: var(--body); font-weight: 500; font-size: 25px; line-height: 1.08; text-align: center; color: var(--bark); }
  /* Text-only fallback: no photo prop, so the name carries the tile. */
  .tile.text { justify-content: center; }
  .tile.text .big { font-family: var(--display); font-weight: 700; font-size: 38px; line-height: 1.08; text-align: center; color: var(--bark); }
  .tile.text .lab { margin-top: 14px; font-family: var(--label); font-weight: 600; font-size: 22px; letter-spacing: 0.24em; text-transform: uppercase; color: var(--sage-dark); }

  /* End card on bark. The official one-colour logo in white, never tinted. */
  .card { position: absolute; inset: 0; background: var(--bark); color: var(--cream); }
  .card .topo { filter: invert(1); opacity: 0.25; }
  .card .mark { position: absolute; left: 190px; top: 700px; width: 700px; aspect-ratio: 512 / 129.364; background: #fff;
    -webkit-mask: url("../../brand/gearbook-full-length-bw.svg") center / contain no-repeat; mask: url("../../brand/gearbook-full-length-bw.svg") center / contain no-repeat; }
  .card .kick { position: absolute; left: 90px; top: 600px; width: 810px; text-align: center; color: #b9b29c; }
  .card .line { position: absolute; left: 90px; top: 960px; width: 810px; text-align: center; font-family: var(--display); font-weight: 700; font-size: 84px; line-height: 1.06; }
  .card .cta { position: absolute; left: 90px; top: 1190px; width: 810px; text-align: center; font-family: var(--display); font-weight: 700; font-size: 72px; color: var(--amber); }
</style>
</head>
<body>
<div id="stage"><div class="topo"></div></div>
<script src="../runtime.js"></script>
<script src="../sound.js"></script>
<script>
  const { el, arrive, words, tick, progress, outCubic } = Motion;
  const P = "../M28-pro-dashboard/products/";
  const ms = (s) => s * 1000;

  // Beats (seconds). Tiles land between FIRST and LAST (8 drops in about 2.7 s); the bar steps
  // with each, crawls to 99, stalls on its own line, then fills at DONE.
  const FIRST = 1.15, LAST = 3.85, STALL = 4.5, DONE = 6.3, CARD = 7.2;
  const LEAD = 0.2;   // a product's status line shows this long before it lands

  Motion.init({
    duration: 10.2,
    hold: 0.8,
    looks: ["main"],
    // The reel's variables. Override any of them with ?props={...}. Each product carries the
    // status line shown as it drops in; a product with no img gets a text-only tile. Up to 9.
    // Spring climbing example:
    // {"season":"Spring","sport":"Rock climbing","products":[{"name":"Petzl GRIGRI+","img":"../M28-pro-dashboard/products/grigri.jpg","line":"Threading the GRIGRI..."}, ...],
    //  "stallLine":"Waiting for the rock to dry...","doneLine":"Ready to send.","endLine":"Stock your climbing catalog."}
    defaults: {
      season: "Winter",
      sport: "Ski and snow",
      loading: "[ loading ]",
      loaded: "[ loaded ]",
      products: [
        { name: "Atomic Bent Chetler 100", img: P + "bent-chetler.jpg", line: "Waxing skis..." },
        { name: "Giro Ledge", img: P + "ledge.jpg", line: "Adjusting helmet..." },
        { name: "Osprey Soelden 32", img: P + "soelden.jpg", line: "Packing the Soelden..." },
        { name: "Julbo Lightyear", img: P + "lightyear.jpg", line: "Defogging goggles..." },
        { name: "Darn Tough ski socks", img: P + "socks.jpg", line: "Finding matching socks..." },
        { name: "Smartwool merino top", img: P + "base-top.jpg", line: "Layering up..." },
        { name: "Smartwool merino bottom", img: P + "base-bottom.jpg", line: "Layering up some more..." },
        { name: "Patagonia R1", img: P + "r1.jpg", line: "Zipping the R1..." },
      ],
      stallLine: "Waiting for the first chair...",
      doneLine: "Ready to drop in.",
      endKicker: "",  // empty: "<season> <loaded>"
      endLine: "Stock your ski catalog.",
      cta: "Link in bio.",
    },
    build(stage, p) {
      ["700 100px roca", "500 46px Outfit", "600 40px 'Afacad Flux'"].forEach((f) => document.fonts.load(f));
      const kit = p.products.slice(0, 9);
      const n = kit.length;
      const land = (i) => (n === 1 ? FIRST : FIRST + ((LAST - FIRST) * i) / (n - 1));

      // Sport label, then the season word letter by letter.
      arrive(el("div", { class: "eyebrow sport", text: p.sport }, stage), 0.1);
      const season = el("div", { class: "season" }, stage);
      [...p.season.toUpperCase()].forEach((ch, i) => {
        const s = el("span", { text: ch }, season);
        s.animate([
          { opacity: 0, transform: "translateY(-70px)", easing: Motion.ease.arrive },
          { opacity: 1, transform: "none" },
        ], { duration: 550, delay: ms(0.25 + i * 0.07), fill: "both" });
        // A small hop when the bar hits 100%.
        s.animate([
          { transform: "none", easing: "cubic-bezier(.3,0,.5,1)" },
          { transform: "translateY(-14px)", easing: "cubic-bezier(.5,0,.7,1)" },
          { transform: "none" },
        ], { duration: 380, delay: ms(DONE + 0.05 + i * 0.04), fill: "none" });
      });

      // The loading bar.
      const load = el("div", { class: "load" }, stage);
      const row = el("div", { class: "row" }, load);
      const tag = el("div", { class: "tag", text: p.loading }, row);
      const pct = el("div", { class: "pct", text: "0%" }, row);
      const fill = el("div", { class: "fill" }, el("div", { class: "track" }, load));
      arrive(load, 0.75);

      // Tiles: rows of 3 (8 lays out 3, 3, 2), the short row centred.
      const tiles = el("div", { class: "tiles" }, stage);
      const W = 250, H = 236, G = 30, RG = 22;
      kit.forEach((item, i) => {
        const r = Math.floor(i / 3), inRow = Math.min(3, n - r * 3), c = i % 3;
        const rowW = inRow * W + (inRow - 1) * G;
        const x = (810 - rowW) / 2 + c * (W + G), y = r * (H + RG);
        const tile = el("div", { class: "tile" + (item.img ? "" : " text"), style: { left: x + "px", top: y + "px" } }, tiles);
        if (item.img) {
          el("img", { src: item.img, alt: "" }, tile);
          el("div", { class: "name", text: item.name }, tile);
        } else {
          el("div", { class: "big", text: item.name }, tile);
          if (item.label !== "") el("div", { class: "lab", text: item.label || p.sport }, tile);
        }
        // Snappy drop with a slight tilt: lands at 60% of 420 ms, a small overshoot, settles.
        const tilt = i % 2 ? 6 : -6;
        tile.animate([
          { opacity: 0, transform: `translateY(-200px) rotate(${tilt}deg)`, easing: "cubic-bezier(.5,0,.9,.6)" },
          { opacity: 1, transform: `translateY(10px) rotate(${-tilt / 4}deg)`, offset: 0.6, easing: "cubic-bezier(.2,.7,.3,1)" },
          { opacity: 1, transform: "none" },
        ], { duration: 420, delay: ms(land(i) - 0.25), fill: "both" });
        // Hop with the season word at 100%.
        tile.animate([
          { transform: "none", easing: "cubic-bezier(.3,0,.5,1)" },
          { transform: "translateY(-16px)", easing: "cubic-bezier(.5,0,.7,1)" },
          { transform: "none" },
        ], { duration: 360, delay: ms(DONE + 0.12 + i * 0.04), fill: "none", composite: "add" });
      });

      // The status line: one line at a time, swapping as each product lands, then the stall
      // line at 99% and the done line at 100%. Lines ending "..." cycle their dots like a loader.
      const lines = kit.map((item, i) => ({ at: land(i) - LEAD, text: item.line || `Loading ${item.name}...` }));
      lines.push({ at: STALL, text: p.stallLine, stall: true });
      if (p.doneLine) lines.push({ at: DONE + 0.1, text: p.doneLine, done: true });
      const status = el("div", { class: "status" }, stage);
      const statusText = el("span", {}, status);
      tick((t) => {
        let k = -1;
        lines.forEach((l, i) => { if (t >= l.at) k = i; });
        if (k < 0) { statusText.textContent = ""; return; }
        const l = lines[k], local = t - l.at;
        let text = l.text;
        if (text.endsWith("...")) {
          const dots = ((Math.floor(local / 0.3) + 2) % 3) + 1;  // 3, 1, 2, 3, ...
          text = text.slice(0, -3) + ".".repeat(dots);
        }
        statusText.textContent = text;
        // Each new line flicks up into place in 120 ms.
        const a = outCubic(progress(t, l.at, 0.12));
        statusText.style.opacity = a;
        statusText.style.transform = `translateY(${(1 - a) * 22}px)`;
        status.style.color = l.done ? "var(--sage-dark)" : "";
      });

      // Bar progress: one step per tile up to 96, a crawl to 99, the stall, then 100.
      const steps = kit.map((_, i) => Math.round((96 * (i + 1)) / n));
      tick((t) => {
        let v = 0;
        steps.forEach((s, i) => { v += (s - (i ? steps[i - 1] : 0)) * outCubic(progress(t, land(i) - 0.04, 0.22)); });
        v += 3 * outCubic(progress(t, LAST + 0.2, STALL - LAST - 0.2));
        const done = t >= DONE;
        if (done) v = 99 + outCubic(progress(t, DONE, 0.15));
        const shown = done ? Math.round(v) : Math.floor(v + 0.0001);
        pct.textContent = shown + "%";
        fill.style.transform = `scaleX(${v / 100})`;
        load.classList.toggle("done", done);
        tag.textContent = done ? p.loaded : p.loading;
        tag.style.color = done ? "var(--sage-dark)" : "";
        pct.style.color = done ? "var(--sage-dark)" : t >= STALL ? "var(--bark)" : "";
      });

      // End card: bark rises from the bottom, then logo and line.
      const card = el("div", { class: "card" }, stage);
      el("div", { class: "topo" }, card);
      card.animate([
        { transform: "translateY(100%)", easing: "cubic-bezier(.6,0,.2,1)" },
        { transform: "none" },
      ], { duration: 520, delay: ms(CARD), fill: "both" });
      const kick = el("div", { class: "eyebrow kick", text: p.endKicker || `${p.season} ${p.loaded}` }, card);
      arrive(kick, CARD + 0.35);
      const mark = el("div", { class: "mark", role: "img", "aria-label": "GearBook" }, card);
      mark.style.left = "145px";
      arrive(mark, CARD + 0.4);
      words(el("div", { class: "line" }, card), p.endLine, CARD + 0.6, 0.1);
      arrive(el("div", { class: "cta", text: p.cta }, card), CARD + 1.0);

      // Sound (on hold, 2026-10-19; retimed 2026-10-21): the season word slides in; first and
      // last tile only; the 99% stall stays silent; one chime on 100%; one whoosh for the card.
      Sound.cue(0.3, "swoosh", { gain: 0.4 });           // the season word slides in (no contact, so no thump)
      Sound.cue(land(0), "thump", { gain: 0.8 });
      Sound.cue(land(n - 1), "thump", { gain: 0.8 });
      Sound.cue(DONE, "chime", { gain: 1 });
      Sound.cue(CARD + 0.1, "whoosh", { gain: 0.6 });    // the card rises (peaks on its fastest frame, ~7.41)

      // Fit the season word to the safe width once fonts are in (any season, any length).
      let fitted = false;
      tick(() => {
        if (fitted) return;
        fitted = true;
        let size = 212;
        season.style.fontSize = size + "px";
        while (season.scrollWidth > 810 && size > 90) { size -= 6; season.style.fontSize = size + "px"; }
      });
    },
  });
</script>
</body>
</html>
