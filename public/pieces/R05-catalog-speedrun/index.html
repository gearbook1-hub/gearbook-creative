<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>R05 Catalog Quest</title>
<link rel="stylesheet" href="../pieces.css" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=block" />
<style>
  /* R05 v3, a whole reel in code: "Catalog Quest", an 8-bit RPG of building a GearBook catalog.
     Luke on v2 (2026-10-19): "Content is all good", but it's game themed, so the graphics go
     8-bit and it breaks the house structure (no cream ground, topo or Roca). Modelled on the
     "Creator Quest" segment of @alexeidelacuesta's reel: a top-down pixel map, a hero walking a
     path, a dark HUD with a segmented XP bar, a tilted paper note per level, a castle at the end.
     Same content as v2: create catalogs, add real products, every product described (the 100%
     rule; a ghost that skipped descriptions is DQ'd), share the page, get paid. No amounts.
     Everything pixel is drawn cell by cell on canvases at 1:1 (never scaled), so it stays crisp.
     v4 (Luke, 2026-10-19): the four products are one Trad Climbing catalog: Camalot C4, Solution
     harness, La Sportiva TC Pro and a Mammut 9.5 Crag Dry rope (were Bent Chetler and Giro Ledge). */
  #stage {
    --red: #d8483a;   /* game red, an accent only (Luke's brief allows game reds and gold) */
    --px: "Press Start 2P", monospace; --vt: VT323, monospace;
    --card: var(--body);  /* Luke, 2026-10-19: the pop-up note cards read as AI-made in Anton; they use Outfit, the game stays pixel */
    background: var(--sage);
  }
  canvas { display: block; image-rendering: pixelated; }
  .layer { position: absolute; inset: 0; }
  .sign, .pick-label, .ghost-tag, .dq, .gate-sign { width: max-content; }
  .abs { position: absolute; }

  /* ---------- The map (world layer, scrolled by the camera) ---------- */
  .world { position: absolute; left: 0; top: 0; width: 1080px; }
  .sign { position: absolute; transform: translateX(-50%); text-align: center; }
  .sign .board { background: color-mix(in srgb, var(--bark) 55%, var(--amber)); color: var(--cream); font-family: var(--px); font-size: 16px;
    line-height: 1; padding: 12px 14px 10px; border: 6px solid var(--bark); white-space: nowrap; box-shadow: 6px 6px 0 color-mix(in srgb, var(--bark) 45%, transparent); }
  .sign .post { width: 12px; height: 30px; margin: 0 auto; background: var(--bark); }
  .pick-label { position: absolute; transform: translateX(-50%); white-space: nowrap; font-family: var(--px); font-size: 20px; line-height: 1;
    color: var(--cream); background: var(--bark); padding: 12px 12px 10px; box-shadow: inset 0 -6px 0 var(--amber), 6px 6px 0 color-mix(in srgb, var(--bark) 40%, transparent); }
  .pick-label b { color: var(--amber); font-weight: 400; }
  .ghost-tag { position: absolute; transform: translateX(-50%); font-family: var(--px); font-size: 16px; line-height: 1; padding: 6px 8px 4px; background: color-mix(in srgb, var(--slate) 70%, var(--bark)); color: var(--white); white-space: nowrap; text-shadow: 3px 3px 0 color-mix(in srgb, var(--bark) 50%, transparent); }
  .dq { position: absolute; transform: translateX(-50%) rotate(-2deg); white-space: nowrap; font-family: var(--px); font-size: 22px; line-height: 1;
    color: var(--white); background: var(--red); padding: 14px 16px 12px; border: 6px solid var(--bark); box-shadow: 8px 8px 0 color-mix(in srgb, var(--bark) 50%, transparent); }
  .gate-sign { position: absolute; transform: translateX(-50%); font-family: var(--px); font-size: 18px; line-height: 1; color: var(--bark); background: var(--amber);
    padding: 9px 10px 7px; border: 5px solid var(--bark); white-space: nowrap; }
  .bars { position: absolute; overflow: hidden; }
  .bars i { position: absolute; left: 0; right: 0; bottom: 0; height: 100%;
    background: repeating-linear-gradient(90deg, var(--bark) 0 12px, transparent 12px 24px); }
  .bars i::before, .bars i::after { content: ""; position: absolute; left: 0; right: 0; height: 12px; background: var(--bark); }
  .bars i::before { top: 6px; } .bars i::after { top: 42px; }

  /* ---------- HUD ---------- */
  .hud { position: absolute; left: 0; top: 0; width: 1080px; height: 456px; background: var(--bark);
    box-shadow: 0 6px 0 color-mix(in srgb, var(--bark) 60%, var(--amber)), 0 12px 0 color-mix(in srgb, var(--bark) 35%, transparent); }
  .hud .ttl { position: absolute; left: 90px; top: 246px; font-family: var(--px); font-size: 30px; color: var(--cream); line-height: 1; }
  .hud .lvlv { position: absolute; right: 180px; top: 246px; font-family: var(--px); font-size: 30px; color: var(--amber); line-height: 1; }
  .xp { position: absolute; left: 90px; top: 298px; width: 810px; height: 36px; display: flex; gap: 10px; }
  .xp .seg { flex: 1; background: color-mix(in srgb, var(--cream) 14%, var(--bark)); box-shadow: inset 0 -6px 0 color-mix(in srgb, var(--bark) 70%, transparent); position: relative; }
  .xp .seg i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--amber); box-shadow: inset 0 -6px 0 color-mix(in srgb, var(--amber) 70%, var(--red)), inset 0 6px 0 color-mix(in srgb, var(--amber) 55%, var(--white)); }
  .slots { position: absolute; left: 90px; top: 356px; display: flex; gap: 12px; }
  .slot { width: 76px; height: 76px; background: color-mix(in srgb, var(--cream) 10%, var(--bark)); border: 4px solid color-mix(in srgb, var(--cream) 28%, var(--bark)); position: relative; }
  .slot > canvas { position: absolute; left: 1px; top: 1px; }
  .slot.done { border-color: var(--amber); }
  .slot .ok { position: absolute; right: -12px; bottom: -12px; width: 32px; height: 32px; background: var(--amber); border: 4px solid var(--bark); }
  .slot .ok canvas { position: absolute; left: 1px; top: 3px; }
  .desc { position: absolute; left: 470px; top: 366px; width: 430px; text-align: right; font-family: var(--px); line-height: 1; }
  .desc small { display: block; font-size: 16px; color: color-mix(in srgb, var(--cream) 65%, var(--bark)); margin-bottom: 14px; }
  .desc b { font-weight: 400; font-size: 34px; color: var(--cream); }
  .desc.full b { color: var(--amber); }
  .xp-pop { position: absolute; font-family: var(--px); font-size: 22px; line-height: 1; color: var(--white); white-space: nowrap; text-shadow: 4px 4px 0 var(--bark); }

  /* ---------- Note cards (screen layer) ---------- */
  .card { position: absolute; background: var(--white); color: var(--bark); padding: 26px 28px 26px; width: 440px;
    box-shadow: 12px 12px 0 color-mix(in srgb, var(--bark) 45%, transparent); }
  .card::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 8px; background: color-mix(in srgb, var(--cream) 60%, var(--sage)); }
  .card .ctag { display: inline-block; background: var(--bark); color: var(--white); font-family: var(--card); font-weight: 600; font-size: 22px; letter-spacing: 0.08em; line-height: 1; padding: 8px 12px 8px; margin-top: 4px; }
  .card .lv { position: absolute; right: -16px; top: -18px; background: var(--red); color: var(--white); font-family: var(--px); font-size: 20px; line-height: 1;
    padding: 11px 12px 9px; border: 5px solid var(--bark); transform: rotate(4deg); }
  .card .big { font-family: var(--card); font-weight: 600; font-size: 56px; line-height: 1.04; letter-spacing: 0.01em; text-transform: uppercase; margin-top: 16px; }
  .card .big em { font-style: normal; color: var(--slate); }
  .card .sub { font-family: var(--card); font-weight: 500; font-size: 24px; line-height: 1.3; letter-spacing: 0.04em; margin-top: 16px; color: var(--ink-muted); }
  .card .url { font-family: var(--card); font-weight: 500; font-size: 30px; line-height: 1; margin-top: 18px; color: var(--white); background: var(--slate); padding: 14px 14px 12px; white-space: nowrap; display: inline-block; }

  /* ---------- Description scroll (screen layer) ---------- */
  .scroll { position: absolute; left: 90px; top: 1150px; width: 810px; height: 340px; background: var(--cream); color: var(--bark);
    border: 6px solid var(--bark); box-shadow: 10px 10px 0 color-mix(in srgb, var(--bark) 45%, transparent), inset 0 0 0 6px color-mix(in srgb, var(--amber) 35%, var(--cream)); }
  .scroll .rule { position: absolute; left: -6px; top: -50px; background: var(--bark); color: var(--amber); font-family: var(--px); font-size: 17px; line-height: 1; padding: 13px 16px 14px; white-space: nowrap; }
  .scroll .it { position: absolute; left: 30px; top: 30px; width: 96px; height: 96px; background: var(--white); border: 5px solid var(--bark); }
  .scroll .it canvas { position: absolute; left: 8px; top: 8px; }
  .scroll .nm { position: absolute; left: 150px; top: 36px; right: 24px; font-family: var(--px); font-size: 21px; line-height: 1.4; }
  .scroll .ct { position: absolute; left: 150px; top: 108px; font-family: var(--px); font-size: 14px; line-height: 1; color: var(--ink-muted); }
  .scroll .bl { position: absolute; left: 30px; top: 150px; right: 30px; font-family: var(--vt); font-size: 64px; line-height: 0.92; color: var(--slate); }
  .scroll .who { position: absolute; left: 30px; bottom: 26px; font-family: var(--px); font-size: 13px; line-height: 1; color: var(--ink-muted); }
  .scroll .plus { position: absolute; right: 22px; bottom: 16px; font-family: var(--px); font-size: 20px; line-height: 1; color: var(--bark); background: var(--amber);
    padding: 11px 12px 9px; border: 5px solid var(--bark); white-space: nowrap; transform-origin: 100% 100%; }

  /* ---------- Arcade screens (title and Quest Complete) ---------- */
  .arcade { position: absolute; inset: 0; overflow: hidden;
    background: linear-gradient(180deg, color-mix(in srgb, var(--slate) 45%, var(--bark)) 0%, color-mix(in srgb, var(--slate) 85%, var(--bark)) 52%, color-mix(in srgb, var(--slate) 65%, var(--red)) 68%); }
  .arcade .star { position: absolute; background: var(--white); }
  .arcade .floor { position: absolute; left: 0; top: 1300px; width: 1080px; height: 620px; background: color-mix(in srgb, var(--bark) 80%, var(--slate)); }
  .arcade svg { position: absolute; left: 0; top: 1300px; }
  .ptext { font-family: var(--px); line-height: 1; text-align: center; position: absolute; left: 0; width: 1080px; white-space: nowrap; }
  .t-big { font-size: 104px; color: var(--cream); text-shadow: 8px 8px 0 var(--red), 16px 16px 0 var(--bark); }
  .t-small { font-size: 20px; color: var(--cream); }
  .t-amber { color: var(--amber); }
  .badge { display: inline-block; background: var(--amber); color: var(--bark); padding: 14px 18px 12px; font-size: 26px; border: 6px solid var(--bark); }
  .end-logo { position: absolute; left: 230px; width: 620px; height: 157px; background: var(--white);
    -webkit-mask: url("../../brand/gearbook-full-length-bw.svg") center / contain no-repeat; mask: url("../../brand/gearbook-full-length-bw.svg") center / contain no-repeat; }
  .vt { font-family: var(--vt); }
  .wipe { position: absolute; left: 0; top: 0; pointer-events: none; }
</style>

<script>
  const { el, progress, outCubic, clamp } = Motion;
  // Hidden layers need their faces requested before the first frame (motion-pieces.md, traps).
  ["32px \"Press Start 2P\"", "32px VT323", "500 32px Outfit", "600 32px Outfit"].forEach((f) => document.fonts.load(f));

  // ---------- Colours: every one from pieces.css, mixes of them, and the game red ----------
  const css = getComputedStyle(document.documentElement);
  const V = (n) => css.getPropertyValue(`--${n}`).trim();
  const hex = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
  const mix = (a, b, k) => { const A = hex(a), B = hex(b); return "#" + A.map((x, i) => Math.round(x + (B[i] - x) * k).toString(16).padStart(2, "0")).join(""); };
  const C = { bark: V("bark"), sage: V("sage"), sageD: V("sage-dark"), cream: V("cream"), amber: V("amber"), slate: V("slate"), muted: V("ink-muted"), white: V("white"), red: "#d8483a" };
  const PAL = {
    grass: C.sage, grassL: mix(C.sage, C.cream, 0.16), grassD: C.sageD,
    path: C.cream, pathE: mix(C.cream, C.bark, 0.2), pebble: mix(C.cream, C.muted, 0.45),
    water: C.slate, waterL: mix(C.slate, C.white, 0.4), waterD: mix(C.slate, C.bark, 0.35), bank: mix(C.cream, C.bark, 0.35),
    wood: mix(C.bark, C.amber, 0.38), woodL: mix(C.bark, C.amber, 0.55), woodD: C.bark,
    leaf: mix(C.sageD, C.bark, 0.42), leafM: C.sageD, leafL: mix(C.sage, C.cream, 0.1), trunk: C.bark,
    rock: mix(C.cream, C.muted, 0.5), rockD: C.muted, rockL: mix(C.cream, C.muted, 0.2),
    stone: mix(C.cream, C.muted, 0.32), stoneD: mix(C.cream, C.muted, 0.7), stoneL: mix(C.cream, C.white, 0.5),
    roof: C.slate, roofD: mix(C.slate, C.bark, 0.4),
    mtn: mix(C.slate, C.bark, 0.25), mtnL: mix(C.slate, C.cream, 0.25), snow: C.white, sky: mix(C.slate, C.cream, 0.62),
  };

  // ---------- Pixel sprites: rows of characters, one per cell, drawn with fillRect ----------
  function drawRows(ctx, rows, pal, x0, y0, cell) {
    rows.forEach((r, j) => { for (let i = 0; i < r.length; i++) { const c = pal[r[i]]; if (c) { ctx.fillStyle = c; ctx.fillRect(x0 + i * cell, y0 + j * cell, cell, cell); } } });
  }
  function sprite(rows, pal, cell) {
    const cv = document.createElement("canvas");
    cv.width = rows[0].length * cell; cv.height = rows.length * cell;
    drawRows(cv.getContext("2d"), rows, pal, 0, 0, cell);
    return cv;
  }
  const o = C.bark;
  const ITEM_ROWS = {
    cam: [
      "...oo....oo...",
      "..oaao..oaao..",
      ".oaaaao.aaaao.",
      ".oaaaaoaaaaao.",
      ".oaayaggayaao.",
      "..oaaaggaaao..",
      "...ooogggoo...",
      "......gg......",
      "...ttttgttt...",
      "......gg......",
      "......gg......",
      ".....rrrr.....",
      "....r....r....",
      ".....rrrr.....",
    ],
    harness: [
      "..............",
      ".oooooooooooo.",
      "ossssyyysssso.",
      "osssoyyyossso.",
      ".oooo.y.oooo..",
      "..os..y..so...",
      ".osso.y.osso..",
      "os..soyos..so.",
      "os...oyo...so.",
      "os...soo...so.",
      ".os.os..so.so.",
      "..oso....oso..",
      "...o......o...",
      "..............",
    ],
    // La Sportiva TC Pro: a high-top trad shoe, toe to the right, laces up the tongue, a rubber rand.
    shoes: [
      "..............",
      "..ooooo.......",
      "..osssso......",
      "..oyyyyo......",
      "..osssso......",
      "..oyyyysoo....",
      "..osssssyyoo..",
      ".odssssssssoo.",
      ".odssssssssso.",
      ".oddsssssssso.",
      ".orrrrrrrrrrro",
      "..oooooooooooo",
      "..............",
      "..............",
    ],
    // Mammut 9.5 Crag Dry: a coiled rope, twisted strands, an amber tie at the top and the two ends hanging.
    rope: [
      "....ooyyoo....",
      "..oorRyyRroo..",
      ".orRooyyooRro.",
      "orRo......oRro",
      "oRro......orRo",
      "orRo......oRro",
      "oRro......orRo",
      ".orRo....oRro.",
      ".oRrRooooRrRo.",
      "..ooRrRrRrRo..",
      "....oorroo....",
      ".....orro.....",
      ".....or.ro....",
      ".....oo..oo...",
    ],
  };
  const ITEM_PAL = {
    cam: { o, a: C.amber, y: mix(C.amber, C.white, 0.5), g: mix(C.cream, C.muted, 0.4), t: C.muted, r: C.red },
    harness: { o, s: C.slate, y: C.amber },
    shoes: { o, s: C.sageD, d: mix(C.sageD, C.bark, 0.4), y: C.amber, r: mix(C.bark, C.muted, 0.35) },
    rope: { o, r: C.red, R: mix(C.red, C.bark, 0.35), y: C.amber },
  };
  const CHECK = ["......k", ".....kk", "k...kk.", "kk.kk..", ".kkk...", "..k...."];
  // The hero, seen from behind as he walks up the map (back of the beanie, the pack).
  const HERO_TOP = [
    "....kkkk....",
    "..kkhhhhkk..",
    ".khhhhhhhhk.",
    ".khhHhhhHhk.",
    ".kHHHHHHHHk.",
    ".krrrrrrrrk.",
    "..krrrrrrk..",
    ".kjjppppjjk.",
    "kjjpPPPPpjjk",
    "kjjppppppjjk",
    "kjjpPppPpjjk",
    "kskppppppksk",
    ".kkjjjjjjkk.",
    "..kllllllk..",
  ];
  const LEGS = [
    ["..kll..llk..", "..kll..llk..", "..kkk..kkk.."],
    ["..kll..llk..", "..kkk..llk..", ".......kkk.."],
    ["..kll..llk..", "..kll..llk..", "..kkk..kkk.."],
    ["..kll..llk..", "..kll..kkk..", "..kkk......."],
  ];
  const HERO_PAL = { k: C.bark, h: C.amber, H: mix(C.amber, C.red, 0.45), r: mix(C.bark, C.amber, 0.25), j: C.slate, p: C.red, P: mix(C.red, C.bark, 0.35), s: mix(C.cream, C.amber, 0.4), l: mix(C.bark, C.slate, 0.3) };
  const GHOST_PAL = { k: mix(C.slate, C.bark, 0.3), h: mix(C.white, C.slate, 0.2), H: mix(C.white, C.slate, 0.45), r: mix(C.white, C.slate, 0.45), j: mix(C.white, C.slate, 0.3), p: mix(C.white, C.slate, 0.55), P: mix(C.white, C.slate, 0.7), s: C.white, l: mix(C.white, C.slate, 0.5) };
  const heroFrames = (pal) => LEGS.map((l) => sprite([...HERO_TOP, ...l], pal, 7));
  // A pixel ellipse: the white ring on a gold base under the hero.
  function ring(cell, rx, ry) {
    const W = rx * 2 + 1, H = ry * 2 + 1, cv = document.createElement("canvas");
    cv.width = W * cell; cv.height = H * cell;
    const g = cv.getContext("2d");
    for (let j = 0; j < H; j++) for (let i = 0; i < W; i++) {
      const d = ((i - rx) / (rx + 0.5)) ** 2 + ((j - ry) / (ry + 0.5)) ** 2;
      const d2 = ((i - rx) / (rx - 1.5)) ** 2 + ((j - ry) / (ry - 1.2)) ** 2;
      if (d <= 1) { g.fillStyle = d2 <= 1 ? mix(C.amber, C.red, 0.15) : C.white; g.fillRect(i * cell, j * cell, cell, cell); }
    }
    return cv;
  }
  const TREE = [
    "....a....",
    "...aab...",
    "...abd...",
    "..aabbd..",
    "...abd...",
    "..aabbdd.",
    ".aaabbbd.",
    "..aabbdd.",
    ".aaabbddd",
    "aaabbbbdd",
    "..ddddd..",
    "....t....",
    "....t....",
  ];
  const TREE_PAL = { a: PAL.leafL, b: PAL.leafM, d: PAL.leaf, t: PAL.trunk };
  const ROCK = [".rrr..", "rLrrr.", "rrrrRr", ".rRRR."];
  const ROCK_PAL = { r: PAL.rock, L: PAL.rockL, R: PAL.rockD };
  const FLOWERS = [[".w.", "wyw", ".w."], [".r.", "ryr", ".r."], [".y.", "y.y", ".y."]];
  const FLOWER_PAL = { w: C.white, y: C.amber, r: C.red };
  const HEART = [".rr.rr.", "rrrrrrr", "rrrrrrr", ".rrrrr.", "..rrr..", "...r..."];
  const FLAG = [
    ["ffffffff..", "fffffffff.", "ffFFffffff", "fffffffff.", "ffffffff.."],
    ["fffffff...", "ffffffffff", "ffFFfffff.", "ffffffffff", "fffffff..."],
  ];

  // ---------- The world: a tall top-down map, read bottom to top ----------
  const WH = 4320, CELL = 6, HERO_Y = 1020;  // the hero's feet sit at screen y 1020
  const RIVER = [1760, 1915], GATE_Y = 1990, CASTLE = { x0: 300, x1: 780, y0: 930, y1: 1250 };
  // The path winds while the hero gathers gear, then runs straight over the bridge to the castle.
  const amp = (y) => 170 * clamp((y - 2000) / 250);
  const pathX = (y) => Math.round(540 + amp(y) * Math.sin((y - 1950) / 230));
  function rng(seed) { let s = seed >>> 0; return () => { s = (s + 0x6d2b79f5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  const hash = (i, j) => { let h = (i * 374761393 + j * 668265263) >>> 0; h = Math.imul(h ^ (h >>> 13), 1274126177) >>> 0; return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };

  function drawMap(cv) {
    cv.width = 1080; cv.height = WH;
    const g = cv.getContext("2d");
    const cols = 1080 / CELL, rows = WH / CELL;
    const cell = (i, j, c) => { g.fillStyle = c; g.fillRect(Math.floor(i) * CELL, Math.floor(j) * CELL, CELL, CELL); };
    const F = (y) => Math.floor(y / CELL);
    // Grass, with darker tufts and a few light flecks.
    g.fillStyle = PAL.grass; g.fillRect(0, 0, 1080, WH);
    for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
      const h = hash(i, j);
      if (h < 0.035) { cell(i, j, PAL.grassD); cell(i - 1, j + 1, PAL.grassD); cell(i + 1, j + 1, PAL.grassD); }
      else if (h > 0.985) cell(i, j, PAL.grassL);
    }
    // Sky and mountains at the top, behind the castle.
    g.fillStyle = PAL.sky; g.fillRect(0, 0, 1080, 960);
    const peaks = [[60, 560, 300], [270, 470, 330], [520, 420, 360], [770, 480, 330], [1000, 540, 300]];
    for (const [px, py, hw] of peaks) {
      for (let j = F(py); j < F(1000); j++) {
        const y = j * CELL, half = ((y - py) / (1000 - py)) * hw;
        for (let i = F(px - half); i <= F(px + half); i++) {
          const x = i * CELL, left = x < px;
          let c = left ? PAL.mtnL : PAL.mtn;

      arcade(title);
      const tP = T(title, "t-small t-amber", 420, p.presents);
      const t1 = T(title, "t-big", 520, p.title[0]);
      const t2 = T(title, "t-big", 660, p.title[1]);
      const tM = T(title, "", 850, `<span class="badge">${p.mode}</span>`);
      const tR = T(title, "t-small", 968, p.rule);
      const tPl = T(title, "t-small", 1390, `${p.player} <span class="vt" style="font-size:34px">${p.sample}</span>`);
      const tS = T(title, "t-amber", 1460, p.start); tS.style.fontSize = "34px";
      [[tP, 0.05], [t1, 0.15], [t2, 0.3], [tM, 0.55], [tR, 0.7], [tPl, 0.85]].forEach(([n, at]) => drop(n, at));
      Motion.tick((t) => {
        title.style.visibility = t < T_MAP ? "visible" : "hidden";
        // PRESS START blinks slowly, then fast once it's "pressed".
        tS.style.visibility = t < 0.95 || t >= T_MAP ? "hidden" : t > 1.75 ? (Math.floor((t - 1.75) / 0.06) % 2 ? "hidden" : "visible") : (Math.floor((t - 0.95) / 0.4) % 2 ? "hidden" : "visible");
      });

      // Quest Complete end screen.
      const endS = el("div", { class: "layer" }, stage);
      arcade(endS);
      const e1 = T(endS, "t-big", 330, p.complete[0]);
      const e2 = T(endS, "t-big", 460, p.complete[1]);
      [e1, e2].forEach((n) => (n.style.fontSize = "88px"));
      const eS = T(endS, "", 610, `<span class="badge">${p.completeSub}</span>`);
      const logo = el("div", { class: "end-logo", style: { top: "722px" } }, endS);
      const eL = T(endS, "t-small", 936, `${p.endLine}<br><span class="t-amber">${p.endLink}</span>`);
      eL.style.fontSize = "34px"; eL.style.lineHeight = "1.6";
      const eF = T(endS, "vt", 1460, p.footnote); Object.assign(eF.style, { fontSize: "34px", color: mix(C.cream, C.slate, 0.35) });
      [[e1, 0.1], [e2, 0.25], [eS, 0.5], [logo, 0.7], [eL, 0.95], [eF, 1.1]].forEach(([n, at]) => drop(n, T_END + at));
      Motion.tick((t) => { endS.style.visibility = t >= T_END ? "visible" : "hidden"; });

      // Block wipes between the screens.
      const wipe = el("canvas", { class: "wipe", width: 1080, height: 1920 }, stage);
      const wg = wipe.getContext("2d");
      function wipeAt(t) {
        let cov = 0;
        for (const s of [T_WIPE1, T_WIPE2]) { const d = s + 0.3; if (t >= s && t < d + 0.3) cov = t < d ? (t - s) / 0.3 : 1 - (t - d) / 0.3; }
        wg.clearRect(0, 0, 1080, 1920);
        if (cov <= 0) return;
        wg.fillStyle = C.bark;
        for (let j = 0; j < 32; j++) for (let i = 0; i < 18; i++) if (hash(i, j + 50) < cov) wg.fillRect(i * 60, j * 60, 60, 60);
      }

      // ===================== The frame =====================
      Motion.tick((t) => {
        const cam = camY(t), hy = heroY(t), hx = pathX(hy);
        world.style.transform = `translateY(${-cam}px)`;
        // Hero, walking when he moves.
        const fr = moving(t) ? Math.floor(t * 9) % 4 : 0;
        heroF.forEach((f, k) => (f.style.display = k === fr ? "block" : "none"));
        const bob = moving(t) && fr % 2 ? -6 : 0;
        hero.style.left = Math.round(hx - 42) + "px"; hero.style.top = Math.round(hy - 112 + bob) + "px";
        ringC.style.left = Math.round(hx - 51) + "px"; ringC.style.top = Math.round(hy - 24) + "px";
        // Ghost.
        const gOn = t >= GHOST[0] && t < 11.0 && !(t > 10.3 && Math.floor(t / 0.08) % 2);
        const gy = ghostY(t), gx = pathX(gy);
        ghost.style.visibility = gtag.style.visibility = gOn ? "visible" : "hidden";
        const gfr = t < GHOST[1] ? Math.floor(t * 14) % 4 : 0;
        ghostF.forEach((f, k) => (f.style.display = k === gfr ? "block" : "none"));
        ghost.style.left = Math.round(gx - 42) + "px"; ghost.style.top = Math.round(gy - 112) + "px";
        gtag.style.left = Math.round(gx) + "px"; gtag.style.top = Math.round(gy - 148) + "px";
        // Items: on the path until picked, then they fly into the bag.
        items.forEach((it, k) => {
          it.node.style.visibility = t < it.at ? "visible" : "hidden";
          it.node.style.transform = Math.floor(t * 3 + k) % 2 ? "translateY(-6px)" : "none";
          const u = progress(t, it.at, 0.32), f = flyers[k];
          f.style.visibility = t >= it.at && u < 1 ? "visible" : "hidden";
          const sx = it.x - 35, sy = it.y - 120 - camY(it.at), d = slotXY(k);
          f.style.left = Math.round(sx + (d.x - sx) * outCubic(u)) + "px"; f.style.top = Math.round(sy + (d.y - sy) * outCubic(u)) + "px";
          slotEls[k].sp.style.visibility = u >= 1 ? "visible" : "hidden";
        });
        // HUD numbers.
        lvl.textContent = `LVL ${LV.filter((a) => t >= a + 0.05).length}/5`;
        const done = [0, 1, 2, 3].filter((i) => t >= D1 + i * DSTEP + 0.5).length;
        descB.textContent = `${done}/4`;
        desc.classList.toggle("full", done === 4);
        slotEls.forEach((s, i) => { s.s.classList.toggle("done", i < done); s.ok.style.visibility = i < done ? "visible" : "hidden"; });
        // Description scroll: which item, and how much of its blurb is written.
        const di = Math.max(0, Math.min(3, Math.floor((t - D1) / DSTEP)));
        const it = p.items[di], u = t - D1 - di * DSTEP;
        scSprites.forEach((s, k) => (s.style.display = k === di ? "block" : "none"));
        scNm.textContent = it.name.toUpperCase(); scCt.textContent = it.cat;
        const n = Math.floor(clamp((u - 0.08) / 0.34) * it.blurb.length + 1e-6);
        scBl.textContent = t < D1 ? "" : "“" + it.blurb.slice(0, n) + (n >= it.blurb.length ? "”" : (Math.floor(t / 0.1) % 2 ? "_" : ""));
        scPlus.style.visibility = t >= D1 && u >= 0.5 ? "visible" : "hidden";
        scPlus.style.transform = u < 0.56 ? "scale(1.25)" : "none";
        // Flag waves; confetti falls.
        const ff = Math.floor(t * 4) % 2; flags.forEach((f, k) => (f.style.display = k === ff ? "block" : "none"));
        const ct = t - LV[4];
        conf.style.visibility = ct > 0 && t < T_WIPE2 + 0.3 ? "visible" : "hidden";
        if (ct > 0) CONF.forEach((c) => { const s = Math.max(0, ct - c.d); c.n.style.left = Math.round((c.x + c.vx * s * 0.6 + Math.sin(s * 6 + c.d * 20) * 20) / 6) * 6 + "px"; c.n.style.top = Math.round((c.y + c.vy * s + 1400 * s * s) / 6) * 6 + "px"; });
        wipeAt(t);
      });

      // ---------- Sound: on hold, a few cues only at the moments that matter ----------
      Sound.cue(1.8, "thump", { gain: 0.7 });                                      // PRESS START
      LV.slice(0, 4).forEach((a) => Sound.cue(a + 0.05, "tick", { gain: 0.6 }));  // level ups
      Sound.cue(LV[4], "chime", { gain: 1 });                                      // the castle: first sale
      Sound.cue(T_WIPE2, "whoosh", { gain: 0.5 });                                 // into Quest Complete
    },
  });
</script>
</body>
</html>
